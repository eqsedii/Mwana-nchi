<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | Mwananchi Supplies Limited</title>
<meta name="description" content="Mwananchi Supplies Limited – quality building materials in Kenya: mabati, water tanks, pipes, paints, tiles, carpets, cabro, fencing and concrete mixers. Order on WhatsApp.">
<meta property="og:image" content="images/banner.jpg"><meta name="theme-color" content="#061a42">
<link rel="icon" href="images/favicon.png"><link rel="stylesheet" href="style.css"></head>
<body data-page="contact">

<div class="ph"><h1>Contact Us</h1><p>We reply fast on WhatsApp</p></div>
<section><div class="wrap two" style="align-items:start"><div class="box rv"><h2 style="color:var(--navy)">Get in touch</h2><p style="margin:12px 0">📍 Nairobi, Kenya<br>🕒 Mon–Sat: 7:30am – 6:00pm<br>✉️ info@mwananchisupplies.co.ke</p>
<a class="btn wa block" target="_blank" href="https://wa.me/254700000000">💬 WhatsApp Us</a><br><a class="btn navy block" href="tel:+254700000000">📞 Call Us</a></div>
<div class="box rv form"><h2 style="color:var(--navy)">Send a message</h2><label>Your name</label><input id="cn"><label>Your message</label><textarea id="cm" rows="4"></textarea><br><br>
<button class="btn wa block" data-act="msg">Send on WhatsApp</button></div></div></section>
<script>document.addEventListener('click',e=>{const b=e.target.closest('[data-act=msg]');if(b)setTimeout(()=>{location.href='https://wa.me/'+MW.whatsapp+'?text='+encodeURIComponent('Hello, I am '+document.getElementById('cn').value+'. '+document.getElementById('cm').value)},700)})</script>
<script src="config.js"></script><script src="products.js"></script><script src="names.js"></script><script src="app.js"></script>
</body></html>
